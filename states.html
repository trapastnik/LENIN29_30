<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>МТК 29 · Государственные образования · 1917—1922</title>
  <link rel="stylesheet" href="/src/styles/fonts.css">
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/pages.css">
  <!-- Первым скриптом: MTK_URL() для путей к ресурсам под file://. См. public/base.js. -->
  <script src="base.js"></script>
  <script src="expo/pin-gate.js?v=20260427"></script>
  <script>if (window.MTK_PIN) window.MTK_PIN.guardPage({ escapeHref: 'expo/people.html' });</script>
  <style>
    .view-toggle {
      display: inline-flex;
      gap: 0;
      border: 1px solid var(--brass);
      border-radius: 30px;
      overflow: hidden;
      font-family: var(--font-mono);
    }
    .view-toggle button {
      /* Переключатель вида — управляющий элемент раздела, ≥64 px (§1). */
      padding: 0 calc(22px * var(--ui-scale, 1));
      font-size: calc(13px * var(--ui-scale, 1));
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--paper-light);
      background: transparent;
      border: none;
      min-height: calc(64px * var(--ui-scale, 1));
      min-width: auto;
    }
    .view-toggle button.active {
      background: var(--paper-light);
      color: var(--ink);
    }

    .hidden { display: none !important; }

    /* ───── Экран 1: выбор группы (крупные блоки) ───── */
    /* pages.css держит body и main блоками — намеренно, на этом стоит
       sticky-шапка. Но тогда `flex: 1` у пикера не от чего растягиваться,
       и шесть плиток жмутся в верхнюю половину 1080, а низ экрана пустой.
       Переопределяем только здесь и только display: overflow не трогаем,
       поэтому sticky остаётся рабочим (проверено на обоих режимах).
       Если решение приживётся — забирайте в pages.css, зона design. */
    /* Селектор по id, а не по классу: vite переносит <link> в конец <head>,
       поэтому pages.css в сборке идёт ПОСЛЕ этого блока, и правило с равной
       специфичностью проигрывает. Так эта правка уже один раз умерла молча —
       экран групп вернулся к 455 px из 1080, и заметно это было только
       замером. Через id порядок подключения перестаёт что-либо решать. */
    html body.scrollable { display: flex; flex-direction: column; }
    html body.scrollable main#page-root { display: flex; flex-direction: column; flex: 1; }

    #groups-mode { display: flex; flex-direction: column; gap: 28px; flex: 1; min-height: 0; }

    /* Групп шесть, а не четыре: к «красным», «белым», «революционной
       демократии» и «интервенции» добавились повстанческие движения (8)
       и национальные государства (13). Раскладка 3×2 держит все шесть;
       прежние repeat(2,1fr) отправляли лишние в неявные строки за край. */
    .group-picker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: calc(24px * var(--ui-scale, 1));
      flex: 1;
      min-height: 0;
    }
    .group-btn {
      padding: calc(40px * var(--ui-scale, 1)) calc(36px * var(--ui-scale, 1));
      background: var(--paper);
      color: var(--ink);
      border: 1.5px solid var(--brass);
      border-top-width: 12px;
      border-top-color: var(--camp-color);
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: calc(14px * var(--ui-scale, 1));
      transition: transform .16s, box-shadow .16s;
      position: relative;
    }
    .group-btn:active {
      transform: translateY(calc(2px * var(--ui-scale, 1)));
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
    }
    .group-btn .kicker {
      font-family: var(--font-mono);
      font-size: calc(13px * var(--ui-scale, 1));
      letter-spacing: 0.3em;
      color: var(--ink-faint);
      text-transform: uppercase;
    }
    .group-btn h3 {
      margin: 0;
      font-family: var(--font-display);
      font-style: italic;
      font-size: calc(48px * var(--ui-scale, 1));
      font-weight: 700;
      line-height: 1.05;
      /* Текст по светлой бумаге — начертательный токен, не заливочный.
         --camp-white это Телегрей 4: как заливка он верен, как текст давал
         контраст 1.45, то есть заголовок «Белые» был практически невидим.
         --camp-*-ink те же лагеря, но затемнённые до читаемых значений. */
      color: var(--camp-ink, var(--camp-color));
    }
    .group-btn .count {
      margin-top: auto;
      font-family: var(--font-mono);
      font-size: calc(18px * var(--ui-scale, 1));
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .group-btn .arrow {
      position: absolute;
      bottom: calc(28px * var(--ui-scale, 1)); right: calc(36px * var(--ui-scale, 1));
      font-size: calc(34px * var(--ui-scale, 1));
      color: var(--camp-ink, var(--camp-color));
      line-height: 1;
    }

    /* ───── Экран 2: drill-down в группу ───── */
    #group-detail .crumbs {
      display: flex; align-items: center; gap: calc(18px * var(--ui-scale, 1));
      margin-bottom: calc(22px * var(--ui-scale, 1));
    }
    #group-detail .back-btn {
      display: inline-flex; align-items: center; gap: calc(10px * var(--ui-scale, 1));
      padding: calc(12px * var(--ui-scale, 1)) calc(22px * var(--ui-scale, 1));
      font-family: var(--font-mono);
      font-size: calc(13px * var(--ui-scale, 1));
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--paper-light);
      background: rgba(250, 240, 210, 0.08);
      border: 1px solid var(--brass);
      border-radius: 30px;
      cursor: pointer;
      min-width: auto; min-height: calc(44px * var(--ui-scale, 1));
    }
    #group-detail .back-btn:active { background: rgba(250, 240, 210, 0.26); }
    #group-detail .group-name {
      font-family: var(--font-display);
      font-style: italic;
      font-size: calc(32px * var(--ui-scale, 1));
      font-weight: 700;
      color: var(--camp-color, var(--paper-light));
    }
    #group-detail .group-name .cnt {
      font-family: var(--font-mono);
      font-size: calc(14px * var(--ui-scale, 1));
      letter-spacing: 0.2em;
      color: var(--paper-warm);
      font-weight: 400;
      font-style: normal;
      margin-left: calc(14px * var(--ui-scale, 1));
    }
    #group-items {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(calc(360px * var(--ui-scale, 1)), 1fr));
      gap: calc(18px * var(--ui-scale, 1));
    }
    .state-plate {
      display: flex;
      flex-direction: column;
      gap: calc(8px * var(--ui-scale, 1));
      padding: calc(22px * var(--ui-scale, 1)) calc(24px * var(--ui-scale, 1));
      background: var(--paper-light);
      color: var(--ink);
      border: 1px solid rgba(168, 135, 90, 0.45);
      border-left: 6px solid var(--camp-color);
      border-radius: 4px;
      cursor: pointer;
      transition: transform .12s, background .12s;
      min-height: calc(120px * var(--ui-scale, 1));
    }
    .state-plate:active { background: var(--paper); transform: translateX(2px); }
    .state-plate .name {
      font-family: var(--font-display);
      font-style: italic;
      font-size: calc(22px * var(--ui-scale, 1));
      font-weight: 700;
      line-height: 1.15;
    }
    .state-plate .abbr {
      font-family: var(--font-mono);
      font-size: calc(12px * var(--ui-scale, 1));
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }
    .state-plate.has-map .abbr::after {
      content: '  ·  карта';
      color: var(--camp-red-deep);
    }
    /* applyStaticLabels() проставляет html[lang]; подпись из ::after
       иначе осталась бы русской при английском интерфейсе. */
    html[lang='en'] .state-plate.has-map .abbr::after { content: '  ·  map'; }

    /* Тач-цели «к экспозиции» и языка держит сама .back-link из pages.css:
       видимый размер 56, а зона нажатия — невидимый ::before высотой
       --touch-hit. Своё переопределение здесь было и МЕРТВО: vite переносит
       <link> в конец <head>, поэтому в сборке pages.css идёт ПОСЛЕ этого
       блока, хотя в исходнике наоборот. Замер на собранном dist: видимая 56,
       computed min-height 56px — выигрывала design, не мы.
       Мёртвое переопределение опаснее отсутствующего: выглядит рабочим
       и просыпается при следующей правке источника. Нашла зона simbirsk.
       #btn-lang при этом жил — id перебивает класс, — и кнопка языка была
       120 против 56 у соседней. Теперь обе одинаковые. */

    #group-detail .back-btn { min-height: 64px; }
  </style>
</head>
<body>
  <header class="page-header" data-section-num="03">
    <div class="page-title">
      <div class="kicker" data-ru="Раздел · 03" data-en="Section · 03">Раздел · 03</div>
      <h1 data-ru="Государственные образования" data-en="State formations">Государственные образования</h1>
    </div>
    <div class="view-toggle" role="tablist">
      <button id="btn-groups" class="active" data-ru="По группам" data-en="By group">По группам</button>
      <button id="btn-grid" data-ru="Сетка" data-en="Grid">Сетка</button>
    </div>
    <a class="back-link" href="index.html" id="back-link" data-ru="← К экспозиции" data-en="← To the exhibit">← К экспозиции</a>
    <button class="back-link" id="btn-lang" type="button">EN</button>
  </header>

  <main id="page-root">
    <div id="groups-mode">
      <div id="group-picker" class="group-picker"></div>
      <div id="group-detail" class="hidden">
        <div class="crumbs">
          <button class="back-btn" id="back-to-groups" data-ru="← К группам" data-en="← To groups">← К группам</button>
          <div class="group-name" id="group-title"></div>
        </div>
        <div id="group-items"></div>
      </div>
    </div>
    <div id="grid-mode" class="hidden brand-scroll"></div>

    <!-- id=state-modal, а НЕ modal: CollectionPage вставляет внутрь #grid-mode
         свою разметку с таким же id="modal", и она идёт в документе раньше.
         getElementById('modal') возвращал ЕЁ — внутри скрытого grid-mode, —
         поэтому openModal раскрывал невидимую чужую модалку, а карточка по
         глубокой ссылке уходила в неё же. Снаружи выглядело как «ссылка
         не работает», хотя работала не та модалка. Два id в одном документе —
         дефект сам по себе; развожу их. -->
    <div id="state-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-sheet">
        <button class="modal-close" aria-label="Закрыть" data-ru="Закрыть" data-en="Close" data-attr="aria-label">×</button>
        <div id="modal-body"></div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      if (window.parent === window) return;
      const a = document.getElementById('back-link');
      if (!a) return;
      a.addEventListener('click', e => {
        e.preventDefault();
        window.parent.postMessage('mtk29:close-section', '*');
      });
    })();
  </script>
  <script type="module">
    import { CollectionPage } from '/src/pages/collection-page.js';
    import { fetchJSON } from '/src/data/loader.js';
    import { applyStaticLabels, wireLangToggle, onLangChange, t, getLang } from '/src/data/i18n.js';
    import { openFromHash } from '/src/data/deep-link.js';
        import '/src/components/state-card.js';

    // Интерфейс двуязычен, содержание справок — нет: перевода 198 справок
    // не будет, в контенте *_en = null (CLAUDE.md §9). Названия групп —
    // тоже контент, они приходят из индекса и остаются русскими.
    applyStaticLabels();

    const idx = await fetchJSON(MTK_URL('content/states/_index.json'));

    // ───── Drill-down режим (ТЗ) ─────
    const pickerEl = document.getElementById('group-picker');
    const detailEl = document.getElementById('group-detail');
    const itemsEl = document.getElementById('group-items');
    const titleEl = document.getElementById('group-title');
    const backBtn = document.getElementById('back-to-groups');
    let activeCamp = null;

    // Временный запас на группы, которых ещё нет в idx.camps.
    // 21 образование (8 повстанческих + 13 национальных) было недоступно:
    // renderPicker шёл по idx.camps, а там перечислены четыре из шести.
    // Заявка в content — дописать записи в _index.json; как только они
    // появятся, эта карта перестанет срабатывать сама собой.
    // Цвета больше не подменяем: design завела --camp-uprising и
    // --camp-national вместе с начертательными --camp-*-ink.
    const CAMP_FALLBACK = {
      uprising: { title_ru: 'Повстанческие движения' },
      national: { title_ru: 'Национальные государства' },
    };

    function countFor(campId) {
      return idx.items.filter(i => i.camp === campId).length;
    }

    // Список групп берём из самих образований, а не из idx.camps: иначе
    // забытая запись в индексе молча прячет целую группу — без ошибки,
    // просто на экране её нет. Порядок idx.camps сохраняем, остальные —
    // следом, по убыванию наполнения.
    function groupsFromItems() {
      const declared = idx.camps || [];
      const order = new Map(declared.map((c, i) => [c.id, i]));
      const ids = [...new Set(idx.items.map(i => i.camp).filter(Boolean))];
      ids.sort((a, b) => {
        const oa = order.has(a) ? order.get(a) : Infinity;
        const ob = order.has(b) ? order.get(b) : Infinity;
        if (oa !== ob) return oa - ob;
        return countFor(b) - countFor(a);
      });
      return ids.map(id => {
        const known = declared.find(c => c.id === id);
        const spare = CAMP_FALLBACK[id];
        if (!known && !spare) console.warn(`[states] группа «${id}» без названия — добавь её в _index.json`);
        return {
          id,
          title_ru: (known && known.title_ru) || (spare && spare.title_ru) || id,
          // Заливка и начертание — разные токены: см. комментарий у .group-btn h3.
          color: `var(--camp-${id})`,
          ink: `var(--camp-${id}-ink, var(--camp-${id}))`,
        };
      });
    }

    function renderPicker() {
      pickerEl.innerHTML = '';
      for (const c of groupsFromItems()) {
        const b = document.createElement('button');
        b.className = 'group-btn';
        b.style.setProperty('--camp-color', c.color);
        b.style.setProperty('--camp-ink', c.ink);
        b.innerHTML = `
          <div class="kicker">${t('Группа', 'Group')}</div>
          <h3>${c.title_ru}</h3>
          <div class="count">${countFor(c.id)} ${t('образований', 'formations')}</div>
          <div class="arrow">→</div>
        `;
        b.addEventListener('click', () => openGroup(c.id));
        pickerEl.appendChild(b);
      }
    }

    function openGroup(campId) {
      activeCamp = campId;
      // Через тот же список, что и плитки: idx.camps не знает про две группы,
      // и прямой find() здесь давал бы undefined.title_ru.
      const camp = groupsFromItems().find(c => c.id === campId);
      const list = idx.items.filter(i => i.camp === campId);
      detailEl.style.setProperty('--camp-color', camp.color);
      detailEl.style.setProperty('--camp-ink', camp.ink);
      titleEl.innerHTML = `${camp.title_ru}<span class="cnt">· ${list.length} `
        + `${t(list.length === 1 ? 'образование' : 'образований', list.length === 1 ? 'formation' : 'formations')}</span>`;
      itemsEl.innerHTML = '';
      for (const it of list) {
        const row = document.createElement('div');
        // role, а не просто div с обработчиком: строка территории —
        // нажимаемая цель, и она должна называть себя так. Иначе её не видит
        // ни проверка тач-целей, ни вспомогательные технологии. Нашлось
        // замером: гейт считал на этой сцене 5 целей вместо 21 — все плитки
        // группы проходили мимо, потому что их нельзя было отличить
        // от оформления. Тег оставлен div: button принёс бы свои стили.
        row.setAttribute('role', 'button');
        row.className = 'state-plate' + (it.map_id ? ' has-map' : '');
        row.style.setProperty('--camp-color', camp.color);
        row.style.setProperty('--camp-ink', camp.ink);
        row.innerHTML = `
          <div class="name">${it.title_ru}</div>
          <div class="abbr">${it.abbr_ru || '\u00A0'}</div>
        `;
        row.addEventListener('click', () => openModal(it));
        itemsEl.appendChild(row);
      }
      pickerEl.classList.add('hidden');
      detailEl.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function backToGroups() {
      detailEl.classList.add('hidden');
      pickerEl.classList.remove('hidden');
      activeCamp = null;
    }
    backBtn.addEventListener('click', backToGroups);

    // ───── Сетка-вид (старый) ─────
    const gridWrap = document.getElementById('grid-mode');
    const gridPage = new CollectionPage({
      kind: 'states',
      indexUrl: MTK_URL('content/states/_index.json'),
      cardTag: 'state-card',
      idAttr: 'state-id',
    });
    gridPage.init(gridWrap);

    // ───── Переключатель ─────
    const btnGroups = document.getElementById('btn-groups');
    const btnGrid = document.getElementById('btn-grid');
    const groupsMode = document.getElementById('groups-mode');
    btnGroups.addEventListener('click', () => {
      btnGroups.classList.add('active'); btnGrid.classList.remove('active');
      groupsMode.classList.remove('hidden'); gridWrap.classList.add('hidden');
      document.body.classList.add('scrollable');
    });
    btnGrid.addEventListener('click', () => {
      btnGrid.classList.add('active'); btnGroups.classList.remove('active');
      gridWrap.classList.remove('hidden'); groupsMode.classList.add('hidden');
      document.body.classList.add('scrollable');
    });

    // ───── Модалка ─────
    const modal = document.getElementById('state-modal');
    // От своей модалки, не getElementById: #modal-body тоже задвоён
    // разметкой CollectionPage, и глобальный поиск вернул бы чужой.
    const modalBody = modal.querySelector('#modal-body');
    function openModal(item) {
      modalBody.innerHTML = '';
      const card = document.createElement('state-card');
      card.setAttribute('stub', JSON.stringify(item));
      card.setAttribute('state-id', item.id);
      card.setAttribute('expanded', '');
      modalBody.appendChild(card);
      modal.classList.remove('hidden');
      modal.setAttribute('aria-hidden', 'false');
    }
    modal.querySelector('.modal-close').addEventListener('click', closeModal);
    modal.querySelector('.modal-backdrop').addEventListener('click', closeModal);
    window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    function closeModal() {
      modal.classList.add('hidden');
      modal.setAttribute('aria-hidden', 'true');
      modalBody.innerHTML = '';
    }

    // init
    document.body.classList.add('scrollable');
    renderPicker();

    // Глубокая ссылка: states.html#card=<id>. Той же модалкой, что и тап.
    // Карточка создаётся с нуля, а не ищется в дереве, поэтому раскрывать
    // группу для неё не требуется — раздел остаётся на экране групп,
    // и посетитель, закрыв карточку, окажется в разделе, а не в пустоте.
    openFromHash(idx.items, openModal, getLang());
    wireLangToggle(document.getElementById('btn-lang'), () => {
      applyStaticLabels();
      // Перерисовываем то, что собрано из строк: плитки групп и, если
      // посетитель уже внутри группы, её заголовок со счётчиком.
      renderPicker();
      if (activeCamp) openGroup(activeCamp);
    });
    // ESC на drill-down возвращает к группам (если модалка не открыта)
    window.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (!modal.classList.contains('hidden')) return;
      if (!detailEl.classList.contains('hidden')) backToGroups();
    });
  </script>
</body>
</html>
