<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Российская империя 1914 — просмотр слоёв</title>
<style>
  :root {
    --bg: #1b1b1f;
    --panel: #25252b;
    --panel-2: #2f2f37;
    --text: #e6e6ea;
    --muted: #9a9aa6;
    --accent: #7aa2ff;
    --border: #3a3a44;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
  #sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  #sidebar header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  #sidebar h1 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  #sidebar .sub { color: var(--muted); font-size: 11px; }
  .toolbar {
    display: flex; gap: 6px; padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .toolbar button, .toolbar input {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 9px; font: inherit; cursor: pointer;
  }
  .toolbar input { flex: 1; min-width: 120px; cursor: text; }
  .toolbar button:hover { border-color: var(--accent); }
  #layers {
    overflow-y: auto;
    padding: 6px 8px 16px;
    flex: 1;
  }
  .group-title {
    color: var(--muted);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 12px 8px 4px;
  }
  .layer {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px; border-radius: 5px;
    cursor: pointer; user-select: none;
  }
  .layer:hover { background: var(--panel-2); }
  .layer input { margin: 0; cursor: pointer; accent-color: var(--accent); }
  .layer .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer .count { color: var(--muted); font-size: 10px; }
  .layer.hidden-match { display: none; }

  #stage {
    position: relative; overflow: hidden;
    background:
      radial-gradient(circle at 30% 20%, #2a2a35 0%, #16161a 70%);
  }
  #svgwrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: grab;
  }
  #svgwrap.grabbing { cursor: grabbing; }
  #svgwrap svg { max-width: 100%; max-height: 100%; display: block; }
  #status {
    position: absolute; left: 12px; bottom: 12px;
    background: rgba(0,0,0,0.55);
    padding: 6px 10px; border-radius: 6px;
    color: var(--muted); font-size: 11px;
    pointer-events: none;
  }
  #loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <h1>Российская империя, 1914</h1>
      <div class="sub">Векторная карта · переключение слоёв</div>
    </header>
    <div class="toolbar">
      <input id="filter" placeholder="Фильтр слоёв…" />
      <button id="all">Все</button>
      <button id="none">Ничего</button>
      <button id="reset">Сброс</button>
    </div>
    <div id="layers"></div>
  </aside>
  <main id="stage">
    <div id="svgwrap"><div id="loading">Загрузка SVG…</div></div>
    <div id="status">колесо — зум · перетаскивание — панорама · двойной клик — сброс вида</div>
  </main>
</div>

<script>
const SVG_PATH = "russian_empire_1914.svg";

const prettify = (id) => {
  // strip Illustrator-mangled ids like "_x31_3_2_" → "13_2"
  let s = id.replace(/_x([0-9a-fA-F]{2,4})_/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
  s = s.replace(/\._/g, " · ").replace(/_/g, " ").replace(/\s+/g, " ").trim();
  return s;
};

const categoryOf = (id) => {
  const u = id.toUpperCase();
  if (/OCEAN|SEA|RIVER|LAKE|RESERVIOR|COAST|HYDRO/.test(u)) return "Гидрография";
  if (/BOUNDARY|FRAME|GEOGRID|GEOLINE/.test(u)) return "Границы и сетка";
  if (/PROVINCE|GUBERNIYA|STATE|DEPENDED|RUSSIAN_IMPERIOR/.test(u)) return "Административные единицы";
  if (/CAPITAL|SETTLEMENT|CENTER|ISLAND|PENN/.test(u)) return "Населённые пункты";
  if (/RAILWAY|ROAD/.test(u)) return "Транспорт";
  if (/LEGEND|NAME|TEXT|MARK/.test(u)) return "Подписи и легенда";
  return "Прочее";
};

const CATEGORY_ORDER = [
  "Административные единицы",
  "Границы и сетка",
  "Гидрография",
  "Транспорт",
  "Населённые пункты",
  "Подписи и легенда",
  "Прочее",
];

const wrap = document.getElementById("svgwrap");
const layersBox = document.getElementById("layers");
const filterInput = document.getElementById("filter");

let svgEl = null;
let topGroups = [];

async function load() {
  const res = await fetch(SVG_PATH);
  const text = await res.text();
  const doc = new DOMParser().parseFromString(text, "image/svg+xml");
  svgEl = doc.documentElement;
  wrap.innerHTML = "";
  wrap.appendChild(svgEl);

  // Make sure svg fills the stage proportionally.
  if (!svgEl.getAttribute("preserveAspectRatio")) {
    svgEl.setAttribute("preserveAspectRatio", "xMidYMid meet");
  }
  svgEl.style.width = "100%";
  svgEl.style.height = "100%";

  // Find the container that actually holds the named layer groups.
  // Illustrator wraps everything in <switch><g i:extraneous="self">…</g></switch>.
  const findLayerContainer = (node) => {
    const childGroupsWithId = Array.from(node.children).filter(
      (c) => c.tagName.toLowerCase() === "g" && c.id
    );
    if (childGroupsWithId.length >= 2) return { container: node, groups: childGroupsWithId };
    for (const c of node.children) {
      if (["g", "switch"].includes(c.tagName.toLowerCase())) {
        const found = findLayerContainer(c);
        if (found) return found;
      }
    }
    return null;
  };
  const found = findLayerContainer(svgEl);
  topGroups = found ? found.groups : [];

  buildLayerList();
  setupPanZoom();
}

function buildLayerList() {
  const grouped = new Map();
  for (const g of topGroups) {
    const cat = categoryOf(g.id);
    if (!grouped.has(cat)) grouped.set(cat, []);
    grouped.get(cat).push(g);
  }

  const cats = [...grouped.keys()].sort(
    (a, b) => CATEGORY_ORDER.indexOf(a) - CATEGORY_ORDER.indexOf(b)
  );

  layersBox.innerHTML = "";
  for (const cat of cats) {
    const title = document.createElement("div");
    title.className = "group-title";
    title.textContent = cat;
    layersBox.appendChild(title);

    for (const g of grouped.get(cat)) {
      const row = document.createElement("label");
      row.className = "layer";
      row.dataset.name = prettify(g.id).toLowerCase();

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = true;
      cb.addEventListener("change", () => {
        g.style.display = cb.checked ? "" : "none";
      });

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = prettify(g.id);

      const count = document.createElement("span");
      count.className = "count";
      count.textContent = g.querySelectorAll("*").length.toLocaleString("ru");

      row.append(cb, name, count);
      layersBox.appendChild(row);
    }
  }
}

document.getElementById("all").onclick = () =>
  layersBox.querySelectorAll('input[type=checkbox]').forEach((cb) => { cb.checked = true; cb.dispatchEvent(new Event("change")); });
document.getElementById("none").onclick = () =>
  layersBox.querySelectorAll('input[type=checkbox]').forEach((cb) => { cb.checked = false; cb.dispatchEvent(new Event("change")); });
document.getElementById("reset").onclick = () => { resetView(); document.getElementById("all").click(); };

filterInput.addEventListener("input", () => {
  const q = filterInput.value.trim().toLowerCase();
  layersBox.querySelectorAll(".layer").forEach((row) => {
    row.classList.toggle("hidden-match", q && !row.dataset.name.includes(q));
  });
});

// --- Pan & zoom on the SVG via viewBox manipulation ---
let baseViewBox = null;
let view = null;

function setupPanZoom() {
  const vb = svgEl.viewBox.baseVal;
  if (!vb || (vb.width === 0 && vb.height === 0)) {
    // fall back to width/height attrs
    const w = parseFloat(svgEl.getAttribute("width")) || 1000;
    const h = parseFloat(svgEl.getAttribute("height")) || 1000;
    svgEl.setAttribute("viewBox", `0 0 ${w} ${h}`);
  }
  const v = svgEl.viewBox.baseVal;
  baseViewBox = { x: v.x, y: v.y, w: v.width, h: v.height };
  view = { ...baseViewBox };
  applyView();

  wrap.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = svgEl.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width;
    const my = (e.clientY - rect.top) / rect.height;
    const scale = Math.exp(e.deltaY * 0.0015);
    const newW = view.w * scale;
    const newH = view.h * scale;
    view.x += (view.w - newW) * mx;
    view.y += (view.h - newH) * my;
    view.w = newW; view.h = newH;
    applyView();
  }, { passive: false });

  let dragging = false, lastX = 0, lastY = 0;
  wrap.addEventListener("pointerdown", (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    wrap.classList.add("grabbing");
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const rect = svgEl.getBoundingClientRect();
    const dx = (e.clientX - lastX) * (view.w / rect.width);
    const dy = (e.clientY - lastY) * (view.h / rect.height);
    view.x -= dx; view.y -= dy;
    lastX = e.clientX; lastY = e.clientY;
    applyView();
  });
  wrap.addEventListener("pointerup", (e) => {
    dragging = false; wrap.classList.remove("grabbing");
    try { wrap.releasePointerCapture(e.pointerId); } catch {}
  });
  wrap.addEventListener("dblclick", resetView);
}

function applyView() {
  svgEl.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
}
function resetView() {
  if (!baseViewBox) return;
  view = { ...baseViewBox };
  applyView();
}

load().catch((err) => {
  wrap.innerHTML = `<div id="loading">Ошибка загрузки SVG: ${err.message}</div>`;
});
</script>
</body>
</html>
