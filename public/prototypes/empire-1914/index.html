<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Российская империя 1914 — просмотр слоёв</title>
<style>
  :root {
    --bg: #1b1b1f;
    --panel: #25252b;
    --panel-2: #2f2f37;
    --text: #e6e6ea;
    --muted: #9a9aa6;
    --accent: #7aa2ff;
    --border: #3a3a44;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  #sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  #sidebar header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  #sidebar h1 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  #sidebar .sub { color: var(--muted); font-size: 11px; }
  .toolbar {
    display: flex; gap: 6px; padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .toolbar button, .toolbar input {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 9px; font: inherit; cursor: pointer;
  }
  .toolbar input { flex: 1; min-width: 120px; cursor: text; }
  .toolbar button:hover { border-color: var(--accent); }
  #layers {
    overflow-y: auto;
    padding: 6px 8px 16px;
    flex: 1;
  }
  .group-title {
    color: var(--muted);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 12px 8px 4px;
  }
  .layer {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px; border-radius: 5px;
    cursor: pointer; user-select: none;
  }
  .layer:hover { background: var(--panel-2); }
  .layer input[type=checkbox] { margin: 0; cursor: pointer; accent-color: var(--accent); }
  .layer .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer .count, .layer .swatch-count { color: var(--muted); font-size: 10px; }
  .layer .swatch {
    display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.18);
  }
  .layer.hidden-match { display: none; }

  /* Calibration panel */
  .calib {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin: 8px;
    padding: 10px 12px;
  }
  .calib h3 {
    margin: 0 0 8px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    display: flex; justify-content: space-between; align-items: center;
  }
  .calib h3 button {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 2px 6px; font: inherit; font-size: 10px;
    cursor: pointer;
  }
  .calib h3 button:hover { color: var(--text); border-color: var(--accent); }
  .calib .row {
    display: grid;
    grid-template-columns: 56px 1fr 56px;
    align-items: center;
    gap: 8px;
    margin: 6px 0;
  }
  .calib label { color: var(--muted); font-size: 11px; }
  .calib input[type=range] { width: 100%; accent-color: var(--accent); }
  .calib input[type=number] {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 3px 5px; font: inherit; font-size: 11px;
    width: 100%; text-align: right;
  }
  .calib .actions {
    display: flex; gap: 6px; margin-top: 8px;
  }
  .calib .actions button {
    flex: 1; padding: 5px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px;
    font: inherit; font-size: 11px; cursor: pointer;
  }
  .calib .actions button:hover { border-color: var(--accent); }

  #stage {
    position: relative; overflow: hidden;
    background:
      radial-gradient(circle at 30% 20%, #2a2a35 0%, #16161a 70%);
  }
  #svgwrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: grab;
  }
  #svgwrap.grabbing { cursor: grabbing; }
  #svgwrap svg { max-width: 100%; max-height: 100%; display: block; }
  #status {
    position: absolute; left: 12px; bottom: 12px;
    background: rgba(0,0,0,0.55);
    padding: 6px 10px; border-radius: 6px;
    color: var(--muted); font-size: 11px;
    pointer-events: none;
  }
  #loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <h1>Российская империя, 1914</h1>
      <div class="sub">Векторная карта · переключение слоёв</div>
    </header>
    <div class="toolbar">
      <input id="filter" placeholder="Фильтр слоёв…" />
      <button id="all">Все</button>
      <button id="none">Ничего</button>
      <button id="reset">Сброс</button>
    </div>
    <div id="layers"></div>
  </aside>
  <main id="stage">
    <div id="svgwrap"><div id="loading">Загрузка SVG…</div></div>
    <div id="status">колесо — зум · перетаскивание — панорама · двойной клик — сброс вида</div>
  </main>
</div>

<script>
const SVG_PATH = "russian_empire_1914.svg";

// map_v6 overlays — все на viewBox 0 0 1500 1000.
const OVERLAYS = [
  { id: "borders_dark",  name: "Границы (тёмные)",  swatch: "#3c3c3b", file: "overlays/borders_dark.svg" },
  { id: "front_blue",    name: "Фронт · синие",     swatch: "#3a78c8", file: "overlays/front_blue.svg" },
  { id: "front_green",   name: "Фронт · зелёные",   swatch: "#5a9a3a", file: "overlays/front_green.svg" },
  { id: "arrows_red",    name: "Стрелки · красные", swatch: "#d34040", file: "overlays/arrows_red.svg" },
  { id: "arrows_pink",   name: "Стрелки · розовые", swatch: "#e895a8", file: "overlays/arrows_pink.svg" },
  { id: "rivers_cyan",   name: "Реки (cyan)",       swatch: "#63b9e9", file: "overlays/rivers_cyan.svg" },
];

// Стартовая калибровка: map_v6 (1500×1000, европейская часть) ставим в
// левую-центральную область 1914-й карты (3600×2610). Пользователь докалибрует.
const DEFAULT_CALIB = { tx: 700, ty: 600, scale: 1.4, opacity: 0.9 };
const STORAGE_KEY = "empire-1914-overlay-calib";

const prettify = (id) => {
  let s = id.replace(/_x([0-9a-fA-F]{2,4})_/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
  s = s.replace(/\._/g, " · ").replace(/_/g, " ").replace(/\s+/g, " ").trim();
  return s;
};

const categoryOf = (id) => {
  const u = id.toUpperCase();
  if (/OCEAN|SEA|RIVER|LAKE|RESERVIOR|COAST|HYDRO/.test(u)) return "Гидрография";
  if (/BOUNDARY|FRAME|GEOGRID|GEOLINE/.test(u)) return "Границы и сетка";
  if (/PROVINCE|GUBERNIYA|STATE|DEPENDED|RUSSIAN_IMPERIOR/.test(u)) return "Административные единицы";
  if (/CAPITAL|SETTLEMENT|CENTER|ISLAND|PENN/.test(u)) return "Населённые пункты";
  if (/RAILWAY|ROAD/.test(u)) return "Транспорт";
  if (/LEGEND|NAME|TEXT|MARK/.test(u)) return "Подписи и легенда";
  return "Прочее";
};

const CATEGORY_ORDER = [
  "Административные единицы",
  "Границы и сетка",
  "Гидрография",
  "Транспорт",
  "Населённые пункты",
  "Подписи и легенда",
  "Прочее",
];

const wrap = document.getElementById("svgwrap");
const layersBox = document.getElementById("layers");
const filterInput = document.getElementById("filter");

let svgEl = null;
let topGroups = [];
let overlayRoot = null;          // <g id="overlay-root"> внутри основной SVG
let calib = loadCalib();          // { tx, ty, scale, opacity }
const overlayCache = new Map();   // id → Promise<DocumentFragment>

function loadCalib() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return { ...DEFAULT_CALIB, ...JSON.parse(raw) };
  } catch {}
  return { ...DEFAULT_CALIB };
}
function saveCalib() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(calib)); } catch {}
}

async function load() {
  const res = await fetch(SVG_PATH);
  const text = await res.text();
  const doc = new DOMParser().parseFromString(text, "image/svg+xml");
  svgEl = doc.documentElement;
  wrap.innerHTML = "";
  wrap.appendChild(svgEl);

  if (!svgEl.getAttribute("preserveAspectRatio")) {
    svgEl.setAttribute("preserveAspectRatio", "xMidYMid meet");
  }
  svgEl.style.width = "100%";
  svgEl.style.height = "100%";

  const findLayerContainer = (node) => {
    const childGroupsWithId = Array.from(node.children).filter(
      (c) => c.tagName.toLowerCase() === "g" && c.id
    );
    if (childGroupsWithId.length >= 2) return { container: node, groups: childGroupsWithId };
    for (const c of node.children) {
      if (["g", "switch"].includes(c.tagName.toLowerCase())) {
        const found = findLayerContainer(c);
        if (found) return found;
      }
    }
    return null;
  };
  const found = findLayerContainer(svgEl);
  topGroups = found ? found.groups : [];

  // overlay-root живёт в том же контейнере, что и нативные слои — последним,
  // чтобы рисоваться поверх.
  overlayRoot = document.createElementNS("http://www.w3.org/2000/svg", "g");
  overlayRoot.setAttribute("id", "overlay-root");
  applyCalibToRoot();
  (found ? found.container : svgEl).appendChild(overlayRoot);

  buildLayerList();
  setupPanZoom();
}

function applyCalibToRoot() {
  if (!overlayRoot) return;
  overlayRoot.setAttribute("transform",
    `translate(${calib.tx}, ${calib.ty}) scale(${calib.scale})`);
  overlayRoot.setAttribute("opacity", String(calib.opacity));
}

async function loadOverlaySvg(file) {
  if (!overlayCache.has(file)) {
    overlayCache.set(file, (async () => {
      const r = await fetch(file);
      const txt = await r.text();
      const d = new DOMParser().parseFromString(txt, "image/svg+xml");
      // Берём детей корневого <svg>, опуская <defs>, <metadata>, <title>, <desc>.
      const root = d.documentElement;
      const frag = document.createDocumentFragment();
      for (const child of Array.from(root.children)) {
        const tag = child.tagName.toLowerCase();
        if (["defs", "metadata", "title", "desc"].includes(tag)) continue;
        frag.appendChild(child.cloneNode(true));
      }
      return frag;
    })());
  }
  return overlayCache.get(file);
}

async function toggleOverlay(o, enabled) {
  let g = overlayRoot.querySelector(`g[data-overlay="${o.id}"]`);
  if (enabled) {
    if (!g) {
      const frag = await loadOverlaySvg(o.file);
      g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("data-overlay", o.id);
      g.appendChild(frag.cloneNode(true));
      overlayRoot.appendChild(g);
    }
    g.style.display = "";
  } else if (g) {
    g.style.display = "none";
  }
}

function buildLayerList() {
  const grouped = new Map();
  for (const g of topGroups) {
    const cat = categoryOf(g.id);
    if (!grouped.has(cat)) grouped.set(cat, []);
    grouped.get(cat).push(g);
  }

  const cats = [...grouped.keys()].sort(
    (a, b) => CATEGORY_ORDER.indexOf(a) - CATEGORY_ORDER.indexOf(b)
  );

  layersBox.innerHTML = "";

  // --- Наложения map_v6 (сверху, отдельной секцией) ---
  appendGroupTitle("Наложения · Гражданская война (map_v6)");
  for (const o of OVERLAYS) {
    const row = document.createElement("label");
    row.className = "layer";
    row.dataset.name = o.name.toLowerCase();

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = false;
    cb.addEventListener("change", () => toggleOverlay(o, cb.checked));

    const sw = document.createElement("span");
    sw.className = "swatch";
    sw.style.background = o.swatch;

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = o.name;

    row.append(cb, sw, name);
    layersBox.appendChild(row);
  }

  // Калибровочная панель
  layersBox.appendChild(buildCalibPanel());

  // --- Нативные слои 1914-й карты ---
  for (const cat of cats) {
    appendGroupTitle(cat);

    for (const g of grouped.get(cat)) {
      const row = document.createElement("label");
      row.className = "layer";
      row.dataset.name = prettify(g.id).toLowerCase();

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = true;
      cb.addEventListener("change", () => {
        g.style.display = cb.checked ? "" : "none";
      });

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = prettify(g.id);

      const count = document.createElement("span");
      count.className = "count";
      count.textContent = g.querySelectorAll("*").length.toLocaleString("ru");

      row.append(cb, name, count);
      layersBox.appendChild(row);
    }
  }
}

function appendGroupTitle(text) {
  const t = document.createElement("div");
  t.className = "group-title";
  t.textContent = text;
  layersBox.appendChild(t);
}

function buildCalibPanel() {
  const panel = document.createElement("div");
  panel.className = "calib";
  panel.innerHTML = `
    <h3>Калибровка наложений
      <button id="calibCopy" title="Скопировать transform в буфер">copy</button>
    </h3>
    <div class="row"><label>Δx</label><input type="range" data-k="tx" min="-2000" max="3600" step="1"><input type="number" data-k="tx" step="1"></div>
    <div class="row"><label>Δy</label><input type="range" data-k="ty" min="-1000" max="2610" step="1"><input type="number" data-k="ty" step="1"></div>
    <div class="row"><label>scale</label><input type="range" data-k="scale" min="0.1" max="5" step="0.001"><input type="number" data-k="scale" step="0.01"></div>
    <div class="row"><label>opacity</label><input type="range" data-k="opacity" min="0" max="1" step="0.01"><input type="number" data-k="opacity" step="0.05"></div>
    <div class="actions">
      <button id="calibSave">Сохранить</button>
      <button id="calibReset">Сброс</button>
    </div>
  `;

  // bind inputs
  for (const inp of panel.querySelectorAll("input[data-k]")) {
    const k = inp.dataset.k;
    inp.value = calib[k];
    inp.addEventListener("input", () => {
      const v = parseFloat(inp.value);
      if (!Number.isFinite(v)) return;
      calib[k] = v;
      // sync partner input (range/number) for same key
      for (const peer of panel.querySelectorAll(`input[data-k="${k}"]`)) {
        if (peer !== inp) peer.value = v;
      }
      applyCalibToRoot();
    });
  }

  panel.querySelector("#calibSave").onclick = () => {
    saveCalib();
    flash(panel.querySelector("#calibSave"), "Сохранено ✓");
  };
  panel.querySelector("#calibReset").onclick = () => {
    calib = { ...DEFAULT_CALIB };
    for (const inp of panel.querySelectorAll("input[data-k]")) inp.value = calib[inp.dataset.k];
    applyCalibToRoot();
  };
  panel.querySelector("#calibCopy").onclick = async () => {
    const s = `translate(${calib.tx}, ${calib.ty}) scale(${calib.scale})`;
    try { await navigator.clipboard.writeText(s); flash(panel.querySelector("#calibCopy"), "✓"); } catch {}
  };

  return panel;
}

function flash(btn, text) {
  const orig = btn.textContent;
  btn.textContent = text;
  setTimeout(() => { btn.textContent = orig; }, 900);
}

document.getElementById("all").onclick = () =>
  layersBox.querySelectorAll('input[type=checkbox]').forEach((cb) => { cb.checked = true; cb.dispatchEvent(new Event("change")); });
document.getElementById("none").onclick = () =>
  layersBox.querySelectorAll('input[type=checkbox]').forEach((cb) => { cb.checked = false; cb.dispatchEvent(new Event("change")); });
document.getElementById("reset").onclick = () => {
  resetView();
  // нативные слои — включить, overlay-чекбоксы — выключить (как при первом открытии)
  layersBox.querySelectorAll('.layer input[type=checkbox]').forEach((cb) => {
    const isOverlay = OVERLAYS.some((o) => cb.parentElement.dataset.name === o.name.toLowerCase());
    cb.checked = !isOverlay;
    cb.dispatchEvent(new Event("change"));
  });
};

filterInput.addEventListener("input", () => {
  const q = filterInput.value.trim().toLowerCase();
  layersBox.querySelectorAll(".layer").forEach((row) => {
    row.classList.toggle("hidden-match", q && !row.dataset.name.includes(q));
  });
});

// --- Pan & zoom on the SVG via viewBox manipulation ---
let baseViewBox = null;
let view = null;

function setupPanZoom() {
  const vb = svgEl.viewBox.baseVal;
  if (!vb || (vb.width === 0 && vb.height === 0)) {
    const w = parseFloat(svgEl.getAttribute("width")) || 1000;
    const h = parseFloat(svgEl.getAttribute("height")) || 1000;
    svgEl.setAttribute("viewBox", `0 0 ${w} ${h}`);
  }
  const v = svgEl.viewBox.baseVal;
  baseViewBox = { x: v.x, y: v.y, w: v.width, h: v.height };
  view = { ...baseViewBox };
  applyView();

  wrap.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = svgEl.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width;
    const my = (e.clientY - rect.top) / rect.height;
    const scale = Math.exp(e.deltaY * 0.0015);
    const newW = view.w * scale;
    const newH = view.h * scale;
    view.x += (view.w - newW) * mx;
    view.y += (view.h - newH) * my;
    view.w = newW; view.h = newH;
    applyView();
  }, { passive: false });

  let dragging = false, lastX = 0, lastY = 0;
  wrap.addEventListener("pointerdown", (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    wrap.classList.add("grabbing");
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const rect = svgEl.getBoundingClientRect();
    const dx = (e.clientX - lastX) * (view.w / rect.width);
    const dy = (e.clientY - lastY) * (view.h / rect.height);
    view.x -= dx; view.y -= dy;
    lastX = e.clientX; lastY = e.clientY;
    applyView();
  });
  wrap.addEventListener("pointerup", (e) => {
    dragging = false; wrap.classList.remove("grabbing");
    try { wrap.releasePointerCapture(e.pointerId); } catch {}
  });
  wrap.addEventListener("dblclick", resetView);
}

function applyView() {
  svgEl.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
}
function resetView() {
  if (!baseViewBox) return;
  view = { ...baseViewBox };
  applyView();
}

load().catch((err) => {
  wrap.innerHTML = `<div id="loading">Ошибка загрузки SVG: ${err.message}</div>`;
});
</script>
</body>
</html>
