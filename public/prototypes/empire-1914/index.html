      layersBox.appendChild(row);
    }
  }

  const pickRow = document.createElement("div");
  pickRow.className = "file-row";
  pickRow.innerHTML = `
    <label class="file-pick">+ Загрузить SVG как наложение
      <input type="file" accept=".svg,image/svg+xml" multiple>
    </label>
  `;
  pickRow.querySelector("input").addEventListener("change", async (e) => {
    for (const f of e.target.files) await addCustomSvgFile(f);
    e.target.value = "";
  });
  layersBox.appendChild(pickRow);

  // Кнопки «вернуть» для скрытых base-групп
  const hiddenBase = groups.filter((g) => !g.isCustom && g.hidden);
  if (hiddenBase.length) {
    const restoreRow = document.createElement("div");
    restoreRow.style.cssText = "display:flex; gap:6px; flex-wrap:wrap; padding: 4px 16px 0;";
    for (const g of hiddenBase) {
      const btn = document.createElement("button");
      btn.style.cssText = "background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; font: inherit; font-size: 10px; cursor: pointer;";
      btn.textContent = `↻ ${g.label}`;
      btn.title = "Вернуть скрытую группу";
      btn.onclick = () => unhideBaseGroup(g.id);
      restoreRow.appendChild(btn);
    }
    layersBox.appendChild(restoreRow);
  }

  const slot = document.createElement("div");
  slot.id = "calibSlot";
  layersBox.appendChild(slot);

  // --- Background layers ---
  if (!bgInfo || !bgInfo.layers.length) {
    appendGroupTitle("Слои подложки");
    const note = document.createElement("div");
    note.style.cssText = "padding: 6px 16px; color: var(--muted); font-size: 11px;";
    note.textContent = bgInfo ? "В подложке нет именованных слоёв." : "Подложка не загружена.";
    layersBox.appendChild(note);
  } else if (bgInfo.use1914Cats) {
    const grouped = new Map();
    for (const l of bgInfo.layers) {
      const cat = categoryOf(l.id);
      if (!grouped.has(cat)) grouped.set(cat, []);
      grouped.get(cat).push(l);
    }
    const cats = [...grouped.keys()].sort(
      (a, b) => CATEGORY_ORDER.indexOf(a) - CATEGORY_ORDER.indexOf(b)
    );
    for (const cat of cats) {
      appendGroupTitle(cat);
      for (const l of grouped.get(cat)) appendLayerRow(l);
    }
  } else {
    appendGroupTitle("Слои подложки");
    for (const l of bgInfo.layers) appendLayerRow(l);
  }

  rebuildCalibPanel();
}

function appendLayerRow(l) {
  const row = document.createElement("label");
  row.className = "layer";
  row.dataset.name = prettify(l.id).toLowerCase();
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = !!l.visible;
  cb.addEventListener("change", () => {
    setLayerVisible(l, cb.checked);
    saveState();
  });
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = prettify(l.id);
  const count = document.createElement("span");
  count.className = "count";
  count.textContent = l.el.querySelectorAll("*").length.toLocaleString("ru");
  row.append(cb, name, count);
  layersBox.appendChild(row);
}

function appendGroupTitle(text) {
  const t = document.createElement("div");
  t.className = "group-title";
  t.textContent = text;
  layersBox.appendChild(t);
}

function rebuildCalibPanel() {
  const slot = document.getElementById("calibSlot");
  if (!slot) return;
  slot.innerHTML = "";
  if (editTarget === VIEW_TARGET) return;
  const g = groups.find((x) => x.id === editTarget);
  if (!g) return;
  slot.appendChild(buildCalibPanel(g));
}

function buildCalibPanel(g) {
  const panel = document.createElement("div");
  panel.className = "calib";
  const isPoints = g.calib.mode === "points";

  panel.innerHTML = `
    <h3>
      <span class="title-flex">Калибровка · ${g.label}</span>
      <button data-act="copy" title="Скопировать transform в буфер">copy</button>
    </h3>
    <div class="mode-row">
      <button data-mode="simple" class="${isPoints ? '' : 'on'}">Простая</button>
      <button data-mode="points" class="${isPoints ? 'on' : ''}">По точкам</button>
    </div>
    <div class="simple-body" style="display:${isPoints ? 'none' : 'block'}">
      <div class="row"><label>Δx</label><input type="range" data-k="tx" min="-2000" max="4000" step="1"><input type="number" data-k="tx" step="1"></div>
      <div class="row"><label>Δy</label><input type="range" data-k="ty" min="-2000" max="3000" step="1"><input type="number" data-k="ty" step="1"></div>
      <div class="row"><label>scale</label><input type="range" data-k="scale" min="0.05" max="6" step="0.001"><input type="number" data-k="scale" step="0.01"></div>
    </div>
    <div class="points-body" style="display:${isPoints ? 'block' : 'none'}">
      <div class="actions" style="margin-top:0">
        <button data-act="cityTag" title="Клик на overlay в точке города → введи имя">🏙 Отметить город</button>
        <button data-act="autoMatch" title="Найти совпадения по подписям городов">⚡ Авто по именам</button>
      </div>
      <div class="actions" style="margin-top:6px">
        <button data-act="addPoint" title="Пара клик-overlay → клик-background">+ Точка вручную</button>
        <button data-act="tps" title="Нелинейный warp через все точки (только для подгруженных SVG)">🌀 TPS warp</button>
        <button data-act="resetPoints">⟲ Сброс</button>
      </div>
      <div class="pts-list" data-role="ptsList"></div>
    </div>
    <div class="row"><label>opacity</label><input type="range" data-k="opacity" min="0" max="1" step="0.01"><input type="number" data-k="opacity" step="0.05"></div>
    <div class="row"><label>линии ×</label><input type="range" data-k="strokeMul" min="0.3" max="6" step="0.1"><input type="number" data-k="strokeMul" step="0.1"></div>
    <div class="actions">
      <button data-act="save">Сохранить</button>
      <button data-act="reset">Сброс всего</button>
    </div>
  `;

  // Mode toggle
  panel.querySelectorAll('.mode-row button').forEach((btn) => {
    btn.onclick = () => {
      const want = btn.dataset.mode;
      if (want === g.calib.mode) return;
      if (want === "points") {
        ensurePointsMode(g);
      } else {
        // Откат к simple: разбираем matrix обратно в tx/ty/scale (только uniform-scale)
        // Если matrix не uniform-scale — оставляем tx/ty/scale как были, но переключаем mode.
        g.calib.mode = "simple";
        applyCalibToGroup(g);
      }
      cancelCapture();
      rebuildCalibPanel();
      renderCalibMarkers();
      saveState();
    };
  });

  const syncInputs = () => {
    for (const inp of panel.querySelectorAll("input[data-k]")) inp.value = g.calib[inp.dataset.k];
  };
  syncInputs();

  for (const inp of panel.querySelectorAll("input[data-k]")) {
    const k = inp.dataset.k;
    inp.addEventListener("input", () => {
      const v = parseFloat(inp.value);
      if (!Number.isFinite(v)) return;
      g.calib[k] = v;
      for (const peer of panel.querySelectorAll(`input[data-k="${k}"]`)) {
        if (peer !== inp) peer.value = v;
      }
      if (k === "strokeMul") {
        applyStrokeMultiplier(g);
      } else {
        // В simple-режиме изменения сразу применяются;
        // в points — opacity и так применится, остальное игнорируется для transform.
        applyCalibToGroup(g);
      }
    });
  }

  // Points list render (inside panel)
  const ptsList = panel.querySelector('[data-role="ptsList"]');
  const renderList = () => {
    ptsList.innerHTML = "";
    const pts = g.calib.points;
    if (!pts.length) {
      const empty = document.createElement("div");
      empty.className = "pts-empty";
      empty.textContent = "Точки не заданы. Нажмите «+ Точка вручную» и кликните сначала на overlay, потом на background.";
      ptsList.appendChild(empty);
      return;
    }
    const residuals = g.calib.fit === "tps"
      ? pts.map(() => 0)  // TPS проходит точно через все опорные
      : (g.calib.points.length >= 3 ? computeResiduals(pts, g.calib.matrix) : pts.map(() => null));
    pts.forEach((p, i) => {
      const row = document.createElement("div");
      row.className = "pt-row";
      const num = document.createElement("span");
      num.className = "num"; num.textContent = String(p.id);
      const label = document.createElement("span");
      label.className = "label";
      const srcMark = p.src === "auto" ? "⚡ "
                     : p.src === "city-tag" ? "🏙 "
                     : "";
      label.textContent = srcMark + (p.name || `(${p.ox.toFixed(0)}, ${p.oy.toFixed(0)})`);
      label.title = p.src === "auto" ? "Автоматическая пара"
                  : p.src === "city-tag" ? "Размечена вручную (имя из bg-индекса)"
                  : "Ручная пара (клик overlay + клик background)";
      const res = document.createElement("span");
      res.className = "res";
      if (residuals[i] != null) {
        res.textContent = residuals[i].toFixed(1);
        if (residuals[i] > Math.max(baseViewBox.w * 0.02, 20)) res.classList.add("big");
      } else {
        res.textContent = "—";
      }
      const rm = document.createElement("button");
      rm.className = "rm"; rm.textContent = "×"; rm.title = "Удалить точку";
      rm.onclick = () => {
        g.calib.points = g.calib.points.filter((x) => x !== p);
        refitGroup(g);
        renderList();
        saveState();
      };
      row.append(num, label, res, rm);
      ptsList.appendChild(row);
    });
    if (pts.length >= 3) {
      const summary = document.createElement("div");
      summary.className = "pts-summary";
      if (g.calib.fit === "tps") {
        summary.innerHTML = `<span>${pts.length} ${pluralize(pts.length, 'точка', 'точки', 'точек')} · 🌀 TPS warp</span><span>residual=0 в опорных</span>`;
      } else {
        const r = computeResiduals(pts, g.calib.matrix);
        summary.innerHTML = `<span>${pts.length} ${pluralize(pts.length, 'точка', 'точки', 'точек')} · affine LSQ</span><span>RMSE ${rmse(r).toFixed(1)}</span>`;
      }
      ptsList.appendChild(summary);
    } else {
      const summary = document.createElement("div");
      summary.className = "pts-summary";
      summary.innerHTML = `<span>${pts.length}/3 минимум для affine</span><span>—</span>`;
      ptsList.appendChild(summary);
    }
  };
  renderList();
  g._renderPtsList = renderList;

  // Add-point button (overlay → background two-click pair)
  const addBtn = panel.querySelector('[data-act=addPoint]');
  if (addBtn) addBtn.onclick = () => startCapture(g);

  // City-tag button: click on overlay → enter name → auto-create pair from bg index
  const cityTagBtn = panel.querySelector('[data-act=cityTag]');
  if (cityTagBtn) cityTagBtn.onclick = () => startCityTag(g);

  // Auto-match by names
  const autoBtn = panel.querySelector('[data-act=autoMatch]');
  if (autoBtn) autoBtn.onclick = () => {
    autoBtn.disabled = true;
    autoBtn.textContent = "⚡ ищу…";
    // даём UI прокраситься перед тяжёлой работой
    setTimeout(() => {
      try {
        const r = runAutoMatch(g);
        if (r) {
          flash(autoBtn, `✓ ${r.matched}/${r.candidates}`);
          if (g._renderPtsList) g._renderPtsList();
        } else {
          autoBtn.textContent = "⚡ Авто по именам";
        }
      } finally {
        autoBtn.disabled = false;
      }
    }, 30);
  };

  // TPS bake / undo
  const tpsBtn = panel.querySelector('[data-act=tps]');
  if (tpsBtn) {
    if (g.calib.fit === "tps") {
      tpsBtn.textContent = "↩ Откатить TPS";
      tpsBtn.title = "Вернуться к affine-фиту";
    }
    tpsBtn.onclick = () => {
      tpsBtn.disabled = true;
      const wasTps = g.calib.fit === "tps";
      tpsBtn.textContent = wasTps ? "↩ откат…" : "🌀 печём…";
      setTimeout(() => {
        try {
          const r = wasTps ? undoTPS(g) : bakeTPS(g);
          if (r.ok) {
            rebuildCalibPanel();
            if (g._renderPtsList) g._renderPtsList();
          } else {
            alert(r.why);
            tpsBtn.textContent = wasTps ? "↩ Откатить TPS" : "🌀 TPS warp";
          }
        } finally {
          tpsBtn.disabled = false;
        }
      }, 30);
    };
  }

  // Reset points
  const resetPtsBtn = panel.querySelector('[data-act=resetPoints]');
  if (resetPtsBtn) resetPtsBtn.onclick = () => {
    g.calib.points = [];
    g.calib.matrix = simpleToMatrix(g.calib.tx, g.calib.ty, g.calib.scale);
    applyCalibToGroup(g);
    renderList();
    renderCalibMarkers();
    saveState();
  };

  panel.querySelector('[data-act=save]').onclick = () => {
    saveState();
    flash(panel.querySelector('[data-act=save]'), "Сохранено ✓");
  };
  panel.querySelector('[data-act=reset]').onclick = () => {
    const base = BASE_GROUPS.find((x) => x.id === g.id);
    g.calib = base ? { ...base.calibDefault, ...makePointsState() } : { tx: 0, ty: 0, scale: 1, opacity: 0.9, ...makePointsState() };
    cancelCapture();
    rebuildCalibPanel();
    applyCalibToGroup(g);
    renderCalibMarkers();
  };
  panel.querySelector('[data-act=copy]').onclick = async () => {
    const c = g.calib;
    const s = c.mode === "points"
      ? `matrix(${c.matrix.join(' ')})`
      : `translate(${c.tx}, ${c.ty}) scale(${c.scale})`;
    try { await navigator.clipboard.writeText(s); flash(panel.querySelector('[data-act=copy]'), "✓"); } catch {}
  };

  panel._sync = syncInputs;
  g._calibPanel = panel;
  return panel;
}

function refreshCalibInputs(g) {
  if (g._calibPanel && g._calibPanel._sync) g._calibPanel._sync();
}
function flash(btn, text) {
  const orig = btn.textContent;
  btn.textContent = text;
  setTimeout(() => { btn.textContent = orig; }, 900);
}

// --- Capture mode (control-point picking) ---
const captureBanner = document.getElementById("captureBanner");
function startCapture(g) {
  if (!g) return;
  closeCityTagPopup();
  ensurePointsMode(g);
  rebuildCalibPanel();
  captureMode = { type: "pair", groupId: g.id, step: "overlay", pointId: g.calib.pointSeq++ };
  updateCaptureBanner();
  stage.classList.add("capture-mode");
  saveState();
}

function startCityTag(g) {
  if (!g) return;
  closeCityTagPopup();
  ensurePointsMode(g);
  rebuildCalibPanel();
  captureMode = { type: "cityTag", groupId: g.id };
  captureBanner.querySelector(".msg").textContent = `Кликни на OVERLAY в точке города (${g.label})`;
  captureBanner.classList.add("on");
  stage.classList.add("capture-mode");
}
function cancelCapture() {
  captureMode = null;
  stage.classList.remove("capture-mode");
  captureBanner.classList.remove("on");
  closeCityTagPopup();
}
function updateCaptureBanner() {
  if (!captureMode) {
    captureBanner.classList.remove("on");
    return;
  }
  const g = groups.find((x) => x.id === captureMode.groupId);
  const what = captureMode.step === "overlay"
    ? `Клик на OVERLAY (${g?.label || ''}) — точка №${captureMode.pointId}`
    : `Теперь клик на BACKGROUND — та же точка №${captureMode.pointId}`;
  captureBanner.querySelector(".msg").textContent = what;
  captureBanner.classList.add("on");
}
function handleCaptureClick(clientX, clientY) {
  if (!captureMode) return false;
  const g = groups.find((x) => x.id === captureMode.groupId);
  if (!g) { cancelCapture(); return true; }

  const { x: wx, y: wy } = screenToWorld(clientX, clientY);

  if (captureMode.type === "cityTag") {
    // 1 клик на overlay → запоминаем overlay-local координаты → показываем popup для имени
    const inv = worldToLocalFn(g);
    if (!inv) { cancelCapture(); return true; }
    const { ox, oy } = inv(wx, wy);
    // Прячем banner на время ввода имени
    captureBanner.classList.remove("on");
    stage.classList.remove("capture-mode");
    openCityTagPopup(clientX, clientY, ox, oy, g);
    return true;
  }

  // type === 'pair' (default — старый flow с двумя кликами)
  if (captureMode.step === "overlay") {
    const inv = worldToLocalFn(g);
    if (!inv) { cancelCapture(); return true; }
    const { ox, oy } = inv(wx, wy);
    captureMode.ox = ox; captureMode.oy = oy;
    captureMode.step = "background";
    updateCaptureBanner();
  } else {
    g.calib.points.push({
      id: captureMode.pointId,
      ox: captureMode.ox, oy: captureMode.oy,
      wx, wy,
      src: "manual",
    });
    refitGroup(g);
    cancelCapture();
    if (g._renderPtsList) g._renderPtsList();
    saveState();
  }
  return true;
}

// --- City-tag popup with autocomplete from bg searchIndex ---
function openCityTagPopup(clientX, clientY, ox, oy, g) {
  closeCityTagPopup();
  const popup = document.createElement("div");
  popup.id = "cityTagPopup";
  const stageRect = stage.getBoundingClientRect();
  // Размещаем чуть правее и ниже точки клика, чтобы не закрывал её
  let leftPx = clientX - stageRect.left + 14;
  let topPx  = clientY - stageRect.top + 14;
  // Защита от ухода за правый/нижний край стейджа
  leftPx = Math.min(leftPx, stage.clientWidth - 340);
  topPx  = Math.min(topPx, stage.clientHeight - 220);
  popup.style.left = leftPx + "px";
  popup.style.top  = topPx + "px";
  popup.innerHTML = `
    <div class="header">Что это за город?</div>
    <input type="text" placeholder="начни вводить имя…" autocomplete="off" spellcheck="false" />
    <div class="suggestions"></div>
    <div class="hint">Enter — выбрать, Esc — отмена</div>
  `;
  stage.appendChild(popup);
  const input = popup.querySelector("input");
  const sugBox = popup.querySelector(".suggestions");

  // City-категории: «Столица», «Губерния», «Город», «Ген.-губерн.» — это то, что
  // мы готовы признать городами для разметки. Реки/моря/легенды/гос-ва исключаем.
  const CITY_CATS = new Set(["Столица", "Губерния", "Город", "Ген.-губерн."]);
  // У snapped-entry координата dot'а, у не-snapped — центр bbox подписи.
  // Для разметки оба варианта приемлемы (TPS-warp всё равно пройдёт через точки точно).
  const candidatesAll = (searchIndex || []).filter((e) => CITY_CATS.has(e.cat));
  let active = 0;

  const render = () => {
    const q = normRu(input.value);
    sugBox.innerHTML = "";
    if (!q) {
      return;
    }
    // Сортировка: prefix > substring, короткие имена выше
    const matches = candidatesAll
      .map((e) => ({ e, idx: e.norm.indexOf(q) }))
      .filter((m) => m.idx >= 0)
      .sort((a, b) => (a.idx - b.idx) || (a.e.text.length - b.e.text.length))
      .slice(0, 8);
    if (active >= matches.length) active = matches.length - 1;
    if (active < 0) active = 0;
    matches.forEach((m, i) => {
      const row = document.createElement("div");
      row.className = "sug" + (i === active ? " active" : "");
      const cat = document.createElement("span");
      cat.className = "cat"; cat.textContent = m.e.cat;
      const name = document.createElement("span");
      name.className = "name";
      const idx = m.idx;
      name.innerHTML = m.e.text.slice(0, idx)
        + "<mark>" + m.e.text.slice(idx, idx + q.length) + "</mark>"
        + m.e.text.slice(idx + q.length);
      row.append(cat, name);
      row.addEventListener("mouseenter", () => { active = i; updateActive(); });
      row.addEventListener("click", () => commit(m.e));
      sugBox.appendChild(row);
    });
  };
  const updateActive = () => {
    [...sugBox.children].forEach((r, i) => r.classList.toggle("active", i === active));
  };
  const getCurrentMatches = () => {
    const q = normRu(input.value);
    if (!q) return [];
    return candidatesAll
      .map((e) => ({ e, idx: e.norm.indexOf(q) }))
      .filter((m) => m.idx >= 0)
      .sort((a, b) => (a.idx - b.idx) || (a.e.text.length - b.e.text.length))
      .slice(0, 8);
  };
  const commit = (entry) => {
    if (!entry) {
      closeCityTagPopup();
      return;
    }
    g.calib.points.push({
      id: g.calib.pointSeq++,
      ox, oy,
      wx: entry.cityX, wy: entry.cityY,
      name: entry.text,
      src: "city-tag",
    });
    refitGroup(g);
    if (g._renderPtsList) g._renderPtsList();
    saveState();
    closeCityTagPopup();
    // Сразу включаем следующий тэг, чтобы можно было быстро размечать подряд
    startCityTag(g);
  };

  input.addEventListener("input", render);
  input.addEventListener("keydown", (e) => {
    const matches = getCurrentMatches();
    if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(matches.length - 1, active + 1); updateActive(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(0, active - 1); updateActive(); }
    else if (e.key === "Enter") {
      e.preventDefault();
      if (matches.length) commit(matches[active].e);
    } else if (e.key === "Escape") {
      e.preventDefault();
      closeCityTagPopup();
      captureMode = null;
    }
  });

  setTimeout(() => input.focus(), 10);
}

function closeCityTagPopup() {
  const p = document.getElementById("cityTagPopup");
  if (p) p.remove();
}

// --- Render control-point markers on stage ---
function renderCalibMarkers() {
  if (!calibMarkers) return;
  calibMarkers.replaceChildren();
  if (editTarget === VIEW_TARGET) return;
  const g = groups.find((x) => x.id === editTarget);
  if (!g || g.calib.mode !== "points") return;

  const r = Math.max(3, baseViewBox.w * 0.0028);  // overlay-circle radius
  const s = r * 2.4;                               // bg-square half-side (больше круга, обрамляет его)

  for (const p of g.calib.points) {
    // Position of OVERLAY point in world coords.
    // В affine-режиме — через текущую матрицу. В TPS — точно в bg-позиции
    // (по построению, поэтому маркеры лягут точно друг на друга).
    const ov = g.calib.fit === "tps"
      ? { x: p.wx, y: p.wy }
      : applyMatrix(g.calib.matrix, p.ox, p.oy);

    // 1. Connection line first (под всем)
    const line = document.createElementNS(SVG_NS, "line");
    line.setAttribute("x1", ov.x); line.setAttribute("y1", ov.y);
    line.setAttribute("x2", p.wx); line.setAttribute("y2", p.wy);
    line.setAttribute("class", "calib-link");
    calibMarkers.appendChild(line);

    // 2. BG square — пустая синяя рамка с чёрной подложкой
    const shadow = document.createElementNS(SVG_NS, "rect");
    shadow.setAttribute("x", p.wx - s); shadow.setAttribute("y", p.wy - s);
    shadow.setAttribute("width", s * 2); shadow.setAttribute("height", s * 2);
    shadow.setAttribute("class", "calib-marker-bg-shadow");
    calibMarkers.appendChild(shadow);

    const bgRect = document.createElementNS(SVG_NS, "rect");
    bgRect.setAttribute("x", p.wx - s); bgRect.setAttribute("y", p.wy - s);
    bgRect.setAttribute("width", s * 2); bgRect.setAttribute("height", s * 2);
    bgRect.setAttribute("class", "calib-marker-bg");
    calibMarkers.appendChild(bgRect);

    // 3. Overlay circle — оранжевая заливка (поверх синей рамки)
    const ovCircle = document.createElementNS(SVG_NS, "circle");
    ovCircle.setAttribute("cx", ov.x); ovCircle.setAttribute("cy", ov.y);
    ovCircle.setAttribute("r", r);
    ovCircle.setAttribute("class", "calib-marker-ov");
    calibMarkers.appendChild(ovCircle);

    // 4. Один номер — на оранжевом круге (центр всей композиции при идеальном фите)
    const lbl = document.createElementNS(SVG_NS, "text");
    lbl.setAttribute("x", ov.x); lbl.setAttribute("y", ov.y);
    lbl.setAttribute("class", "calib-marker-label");
    lbl.textContent = String(p.id);
    calibMarkers.appendChild(lbl);
  }
}

// --- Custom SVG overlay loader ---
async function addCustomSvgFile(file) {
  const text = await file.text();
  const label = file.name.replace(/\.svg$/i, "");
  const color = pickColor();
  const g = makeCustomGroup({ label, color, svgText: text });
  groups.push(g);
  ensureGroupRoot(g);
  for (const o of g.overlays) await mountOverlay(g, o);
  buildTargetBar();
  buildLayerList();
  setEditTarget(g.id);
  saveState();
}
const CUSTOM_COLORS = ["#7aa2ff", "#8ad57d", "#ff8aa0", "#c39bff", "#ffb86c", "#5ee0c6"];
function pickColor() {
  const used = new Set(groups.map((g) => g.color));
  return CUSTOM_COLORS.find((c) => !used.has(c)) || CUSTOM_COLORS[Math.floor(Math.random()*CUSTOM_COLORS.length)];
}

// --- Toolbar buttons ---
document.getElementById("all").onclick = () => {
  layersBox.querySelectorAll('input[type=checkbox]').forEach((cb) => { cb.checked = true; cb.dispatchEvent(new Event("change")); });
};
document.getElementById("none").onclick = () => {
  layersBox.querySelectorAll('input[type=checkbox]').forEach((cb) => { cb.checked = false; cb.dispatchEvent(new Event("change")); });
};
document.getElementById("reset").onclick = () => {
  resetView();
  layersBox.querySelectorAll('.layer input[type=checkbox]').forEach((cb) => {
    const isOverlay = cb.parentElement.querySelector(".swatch") !== null;
    cb.checked = !isOverlay;
    cb.dispatchEvent(new Event("change"));
  });
};
filterInput.addEventListener("input", () => {
  const q = filterInput.value.trim().toLowerCase();
  layersBox.querySelectorAll(".layer").forEach((row) => {
    row.classList.toggle("hidden-match", q && !row.dataset.name.includes(q));
  });
});

// --- Background-slot buttons ---
document.getElementById("bgFilePick").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (file) await loadBackgroundFromFile(file);
  e.target.value = "";
});
document.getElementById("bgClose").onclick = () => {
  if (confirm("Убрать текущую подложку? Список слоёв очистится.")) closeBackground();
};
document.getElementById("emptyFilePick").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (file) await loadBackgroundFromFile(file);
  e.target.value = "";
});
document.getElementById("loadDefaultBtn").onclick = async () => {
  const p = PRESET_BACKGROUNDS[0];
  await loadBackgroundFromUrl(p.file, p.id, p.name);
};

// --- Drag-and-drop SVG onto stage ---
stage.addEventListener("dragover", (e) => {
  if (e.dataTransfer && [...e.dataTransfer.items].some((i) => i.kind === "file")) {
    e.preventDefault();
    stage.classList.add("drag-over");
  }
});
stage.addEventListener("dragleave", (e) => {
  if (e.target === stage) stage.classList.remove("drag-over");
});
stage.addEventListener("drop", async (e) => {
  e.preventDefault();
  stage.classList.remove("drag-over");
  const files = [...(e.dataTransfer?.files || [])].filter((f) => /\.svg$/i.test(f.name) || f.type === "image/svg+xml");
  if (!files.length) return;
  if (!bgInfo) {
    // нет подложки → первая SVG становится подложкой, остальные — наложениями
    await loadBackgroundFromFile(files[0]);
    for (const f of files.slice(1)) await addCustomSvgFile(f);
  } else {
    // спросим: подложка или наложение?
    const useAsBg = files.length === 1 && confirm("Загрузить как подложку (OK) или как наложение (Cancel)?");
    if (useAsBg) await loadBackgroundFromFile(files[0]);
    else for (const f of files) await addCustomSvgFile(f);
  }
});

// --- Pan / zoom / edit ---
let baseViewBox = null;
let view = null;

function initPanZoomForCurrentBg() {
  const v = rootSvg.viewBox.baseVal;
  baseViewBox = { x: v.x, y: v.y, w: v.width, h: v.height };
  view = { ...baseViewBox };
  applyView();
}

function setupPanZoom() {
  baseViewBox = { x: 0, y: 0, w: 1000, h: 1000 };
  view = { ...baseViewBox };
  applyView();
  wrap.addEventListener("wheel", onWheel, { passive: false });
  wrap.addEventListener("pointerdown", onPointerDown);
  wrap.addEventListener("pointermove", onPointerMove);
  wrap.addEventListener("pointerup", onPointerUp);
  wrap.addEventListener("pointercancel", onPointerUp);
  wrap.addEventListener("dblclick", () => {
    if (editTarget === VIEW_TARGET) resetView();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (captureMode) { cancelCapture(); return; }
      if (editTarget !== VIEW_TARGET) setEditTarget(VIEW_TARGET);
    }
  });
}

function screenToWorld(clientX, clientY) {
  const rect = rootSvg.getBoundingClientRect();
  const x = ((clientX - rect.left) / rect.width) * view.w + view.x;
  const y = ((clientY - rect.top) / rect.height) * view.h + view.y;
  return { x, y, rect };
}

function onWheel(e) {
  e.preventDefault();
  const factor = Math.exp(e.deltaY * 0.0015);
  if (editTarget === VIEW_TARGET) {
    const rect = rootSvg.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width;
    const my = (e.clientY - rect.top) / rect.height;
    const newW = view.w * factor;
    const newH = view.h * factor;
    view.x += (view.w - newW) * mx;
    view.y += (view.h - newH) * my;
    view.w = newW; view.h = newH;
    applyView();
  } else {
    const g = groups.find((x) => x.id === editTarget);
    if (!g) return;
    const { x: wx, y: wy } = screenToWorld(e.clientX, e.clientY);
    if (g.calib.mode === "points") {
      const k = 1 / factor;  // factor > 1 = zoom out, k < 1 (matrix shrinks output)
      const m = g.calib.matrix;
      g.calib.matrix = [
        m[0]*k, m[1]*k, m[2]*k, m[3]*k,
        m[4]*k + (1-k)*wx,
        m[5]*k + (1-k)*wy,
      ];
    } else {
      const s = g.calib.scale;
      const s2 = clamp(s / factor, 0.02, 20);
      const k = s2 / s;
      g.calib.scale = s2;
      g.calib.tx = wx + (g.calib.tx - wx) * k;
      g.calib.ty = wy + (g.calib.ty - wy) * k;
    }
    applyCalibToGroup(g);
    refreshCalibInputs(g);
    renderCalibMarkers();
  }
}

let dragging = false, lastX = 0, lastY = 0, dragGroup = null;
function onPointerDown(e) {
  if (e.button !== 0) return;
  if (captureMode) {
    e.preventDefault();
    handleCaptureClick(e.clientX, e.clientY);
    return;
  }
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  wrap.classList.add("grabbing");
  wrap.setPointerCapture(e.pointerId);
  dragGroup = editTarget === VIEW_TARGET ? null : groups.find((x) => x.id === editTarget);
}
function onPointerMove(e) {
  if (!dragging) return;
  const rect = rootSvg.getBoundingClientRect();
  const dxWorld = (e.clientX - lastX) * (view.w / rect.width);
  const dyWorld = (e.clientY - lastY) * (view.h / rect.height);
  if (dragGroup) {
    if (dragGroup.calib.mode === "points") {
      dragGroup.calib.matrix[4] += dxWorld;
      dragGroup.calib.matrix[5] += dyWorld;
    } else {
      dragGroup.calib.tx += dxWorld;
      dragGroup.calib.ty += dyWorld;
    }
    applyCalibToGroup(dragGroup);
    refreshCalibInputs(dragGroup);
    renderCalibMarkers();
  } else {
    view.x -= dxWorld;
    view.y -= dyWorld;
    applyView();
  }
  lastX = e.clientX; lastY = e.clientY;
}
function onPointerUp(e) {
  if (!dragging) return;
  dragging = false; wrap.classList.remove("grabbing");
  try { wrap.releasePointerCapture(e.pointerId); } catch {}
  if (dragGroup) saveState();
  dragGroup = null;
}

function applyView() {
  rootSvg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
}
function resetView() {
  if (!baseViewBox) return;
  view = { ...baseViewBox };
  applyView();
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

boot().catch((err) => {
  console.error(err);
  wrap.innerHTML = `<div style="padding:20px;color:#ffcc66">Ошибка инициализации: ${err.message}</div>`;
});
</script>
