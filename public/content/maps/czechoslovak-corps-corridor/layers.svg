<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948.9 213.8">
  <!-- Чехословацкий корпус. Сгенерировано
       scripts/maps/build_territory_maps.py.
       geometry_kind corridor: своя проекция,
       с базой не складывается. -->
<!-- Чехословацкий корпус: коридор вдоль Транссиба. -->
  <!-- Сгенерировано scripts/maps/build_corridor.py из полей
       corridor.waypoints в public/content/geo/_index.json —
       руками не править. Источник правды — реестр, координаты
       там в градусах.
       Ломаная соединяет точки в ГЕОГРАФИЧЕСКОМ порядке (n),
       с запада на восток. Хронология в data-from и НЕ совпадает
       с ним: Пенза на западном конце взята 29 мая, Мариинск
       в Сибири — к 27 мая. Анимировать по n значит показать
       волну с запада, которой не было. -->
  <g id="corridor_line">
    <polyline points="40.0,73.0 91.5,73.0 204.0,53.4 243.4,50.6 281.5,56.3 323.7,55.1 419.2,54.7 439.7,40.0 467.5,42.9 547.1,43.0 580.3,56.0 908.9,173.8" fill="none"/>
  </g>
