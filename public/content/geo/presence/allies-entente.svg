  <text x="183.8" y="322.9" font-size="12">Эривань</text>
  <text x="155.1" y="308.3" font-size="12">Батум</text>
  <text x="1166.7" y="204.7" font-size="12">Северный Сахалин</text>
</g>
</svg>
