<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Музей В.И. Ленина · Гражданская война · 1917—1922</title>
<!-- Первым скриптом: даёт MTK_URL() для путей к ресурсам. Под file:// киоска
     ведущий слэш резолвится в корень ФС, и раздел молча пуст. См. public/base.js. -->
<script src="../base.js"></script>
<!-- Палитра, шрифты и метрики — один генерируемый артефакт из
     src/design/tokens.json. Раньше здесь стояли /src/styles/{fonts,tokens}.css:
     vite их в dist не кладёт: каталог expo лежит в public и идёт мимо
     сборки. Обе
     ссылки отдавали 404 — сцена месяц ехала без Nolde и без --touch-hit,
     причём молча: отвалившийся <link> не даёт ошибки в консоли. -->
<link rel="stylesheet" href="brand-tokens.css?v=20260803">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--scene-bg);
    color: var(--scene-ink);
    font-family: '21 Cent', 'PT Serif', Georgia, serif;
    overflow: hidden;
  }
  #root { position: absolute; inset: 0; }
  /* скрываем курсор в тач-режиме */
  * { cursor: default; }
  button { cursor: pointer; }
  /* скрываем скроллбар везде, кроме блоков с .brand-scroll (см. tokens.css) */
  :not(.brand-scroll)::-webkit-scrollbar { display: none; }
  :not(.brand-scroll) { scrollbar-width: none; }
</style>
</head>
<body>
<div id="root"></div>

<!-- React как локальные UMD-сборки. Киоск работает офлайн (CLAUDE.md §1),
     внешних запросов быть не должно. Production-сборки, не development. -->
<script src="vendor/react-18.3.1.production.min.js"></script>
<script src="vendor/react-dom-18.3.1.production.min.js"></script>

<!-- Единственный источник палитры: генерируется из src/design/tokens.json.
     Заменил theme.js. Правки — в tokens.json, не здесь. -->
<script src="brand-tokens.js?v=20260802"></script>
<script src="pin-gate.js?v=20260427"></script>
<script>
  // Главная экспозиция /expo/ закрыта пин-кодом. Без кода доступ только
  // к разделу «Персоналии» — кнопка-эскейп на gate-оверлее.
  if (window.MTK_PIN) {
    window.MTK_PIN.guardPage({ escapeHref: 'people.html', escapeLabel: '→ К персоналиям' });
  }
</script>
<script src="data.js?v=20260426c"></script>
<!-- Сцена: предкомпилированный JSX. Исходники — соседние *.jsx, компилятор —
     scripts/expo/build-jsx.mjs (esbuild). Babel-in-browser убран: он компилировал
     ~180 КБ JSX при каждом старте, на киоске это секунды белого экрана.
     Порядок важен: shared → экраны → точка входа. -->
<script src="build/shared.js"></script>
<script src="build/main-screen.js"></script>
<script src="build/boot-expo.js"></script>
</body>
</html>
